[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-model-ci"
version = "0.1.0"
description = "Physics-aware structural and asset checks for robot models generated by CAD2Sim or other model pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Robot Model CI contributors"}]
dependencies = []

[project.scripts]
robot-model-ci = "robot_model_ci.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
